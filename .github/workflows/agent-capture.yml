name: Agent capture

on:
  workflow_call:
    inputs:
      store_artifacts:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      frame_gap_surfaces:
        description: Diagnostic only; compare original and owned buffers in four full cycles
        type: boolean
        default: false
      frame_gap_full:
        description: Diagnostic only; trace the original full native workflow
        type: boolean
        default: false
      frame_gap_heartbeat:
        description: Diagnostic full workflow only; schedule the recorder heartbeat timer
        type: boolean
        default: true
      frame_gap_owned_buffers:
        description: Diagnostic full workflow only; copy frames into owned buffers
        type: boolean
        default: false
      frame_gap_nv12:
        description: Diagnostic full workflow only; request video-range NV12 recording frames
        type: boolean
        default: false
      frame_gap_deeper_queue:
        description: Diagnostic full workflow only; request recording queue depth five
        type: boolean
        default: false
      frame_gap_replay:
        description: Diagnostic only; compare eight original-prefix writer lifetime arms
        type: boolean
        default: false
      frame_gap_workload:
        description: Diagnostic only; trace three native and actual client cycles
        type: boolean
        default: false
      frame_gap_probe:
        description: Diagnostic only; validate scripts and agent protocol without capture
        type: boolean
        default: false
      store_artifacts:
        description: Upload native evidence and build logs
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agent-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  script-validation:
    if: ${{ inputs.frame_gap_probe }}
    runs-on: macos-15
    timeout-minutes: 5
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Validate scripts
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest discover -s scripts/tests -v 2>&1 | tee script-tests.log

      - name: Validate agent protocol
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path Packages/ShareXAgent 2>&1 | tee agent-tests.log

      - name: Store validation logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-${{ github.sha }}
          retention-days: 3
          path: |
            script-tests.log
            agent-tests.log
          if-no-files-found: warn

  native:
    if: ${{ !inputs.frame_gap_probe }}
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Select Apple Silicon toolchain
        id: toolchain
        run: |
          diagnostic_modes=0
          for mode in '${{ inputs.frame_gap_probe }}' '${{ inputs.frame_gap_workload }}' '${{ inputs.frame_gap_replay }}' '${{ inputs.frame_gap_full }}' '${{ inputs.frame_gap_surfaces }}'; do
            if [[ "$mode" == true ]]; then diagnostic_modes=$((diagnostic_modes + 1)); fi
          done
          if [[ "$diagnostic_modes" -gt 1 ]]; then
            echo 'Choose one frame-gap diagnostic mode.' >&2
            exit 2
          fi
          if [[ '${{ inputs.frame_gap_full }}' == true && '${{ inputs.frame_gap_nv12 }}' == true && '${{ inputs.frame_gap_owned_buffers }}' == true ]]; then
            echo 'Owned-buffer copying requires BGRA; disable owned buffers for NV12.' >&2
            exit 2
          fi
          test "$(uname -m)" = arm64
          sudo xcode-select -s /Applications/Xcode_26.3.app
          sw_vers
          xcodebuild -version
          swift --version

      - name: Validate scripts and agent protocol
        run: |
          set -o pipefail
          python3 -m unittest discover -s scripts/tests -v
          swift test --package-path Packages/ShareXAgent 2>&1 | tee agent-tests.log

      - name: Generate project
        id: project
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          printf 'DEVELOPMENT_TEAM =\nSHAREX_LOCAL_CONFIG = present\nCODE_SIGN_IDENTITY = -\n' > Local.xcconfig
          scripts/ci-setup.sh

      - name: Build Release app (optional diagnostic flag)
        id: release-build
        if: ${{ !cancelled() && steps.project.outcome == 'success' }}
        run: |
          set -o pipefail
          probe_flags=()
          if [[ '${{ inputs.frame_gap_probe }}' == true || '${{ inputs.frame_gap_workload }}' == true || '${{ inputs.frame_gap_replay }}' == true || '${{ inputs.frame_gap_full }}' == true || '${{ inputs.frame_gap_surfaces }}' == true ]]; then
            probe_flags+=(SWIFT_ACTIVE_COMPILATION_CONDITIONS=FRAME_GAP_PROBE)
          fi
          xcodebuild build -project ShareXMac.xcodeproj -scheme ShareX -configuration Release \
            -destination 'platform=macOS' -derivedDataPath build-agent -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" "${probe_flags[@]}" \
            2>&1 | tee agent-build.log
          xcodebuild -showBuildSettings -json -project ShareXMac.xcodeproj -scheme ShareX \
            -configuration Release -destination 'platform=macOS' -derivedDataPath build-agent \
            -disableAutomaticPackageResolution CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" "${probe_flags[@]}" > agent-build-settings.json

      - name: Install and sign app
        id: installed
        if: ${{ !cancelled() && steps.release-build.outcome == 'success' }}
        run: |
          set -euo pipefail
          test ! -e /Applications/ShareX.app
          codesign --force --deep --options runtime -s - build-agent/Build/Products/Release/ShareX.app
          ditto build-agent/Build/Products/Release/ShareX.app /Applications/ShareX.app
          codesign --verify --deep --strict /Applications/ShareX.app
          test "$(lipo -archs /Applications/ShareX.app/Contents/MacOS/ShareX)" = arm64
          plutil -lint /Applications/ShareX.app/Contents/Info.plist

      - name: Prepare disposable runner account permissions
        id: capture-permission
        if: ${{ !cancelled() && steps.installed.outcome == 'success' }}
        run: |
          bash scripts/ci-capture-permissions.sh /Applications/ShareX.app
          defaults write com.sharexmac.ShareX agentCaptureEnabled -bool false

      - name: Build and authorize independent setup driver
        id: setup-helper
        if: ${{ !cancelled() && !inputs.frame_gap_probe && !inputs.frame_gap_workload && steps.capture-permission.outcome == 'success' }}
        run: |
          xcrun swiftc -parse-as-library -swift-version 6 -O -target arm64-apple-macosx14.0 \
            scripts/e2e-agent-setup.swift -o "$RUNNER_TEMP/sharex-agent-setup-helper"
          codesign --force -s - "$RUNNER_TEMP/sharex-agent-setup-helper"
          bash scripts/ci-capture-permissions.sh --helper "$RUNNER_TEMP/sharex-agent-setup-helper"

      - name: Validate setup UI, recording controls, and old capture deletion
        id: setup-ui
        if: ${{ !cancelled() && !inputs.frame_gap_surfaces && steps.setup-helper.outcome == 'success' }}
        timeout-minutes: 8
        run: |
          python3 scripts/e2e-agent-setup.py --app /Applications/ShareX.app \
            --build-settings "$PWD/agent-build-settings.json" \
            --helper "$RUNNER_TEMP/sharex-agent-setup-helper" --out "$PWD/agent-setup-out"

      - name: Compare eight writer lifetime targets after the original native prefix
        if: ${{ !cancelled() && inputs.frame_gap_replay && steps.setup-ui.outcome == 'success' }}
        timeout-minutes: 36
        run: |
          defaults write com.sharexmac.ShareX agentCaptureEnabled -bool true
          python3 scripts/frame-gap-startup.py --app /Applications/ShareX.app \
            --build-settings "$PWD/agent-build-settings.json" --setup-result "$PWD/agent-setup-out/result.json" \
            --comparison writer-lifetime \
            --commit '${{ github.sha }}' --out "$PWD/frame-gap-startup-out"

      - name: Print writer lifetime comparison
        if: ${{ always() && inputs.frame_gap_replay }}
        run: |
          if test -f frame-gap-startup-out/comparison.json; then cat frame-gap-startup-out/comparison.json; fi

      - name: Capture real pixels and verify decoded media
        if: ${{ !cancelled() && !inputs.frame_gap_surfaces && !inputs.frame_gap_probe && !inputs.frame_gap_replay && !inputs.frame_gap_workload && steps.capture-permission.outcome == 'success' }}
        timeout-minutes: 18
        run: |
          if [[ '${{ inputs.frame_gap_full }}' == true ]]; then
            export SHAREX_FRAME_GAP_WORKLOAD=1 SHAREX_FRAME_GAP_FIXTURE_TRACE=1
            export SHAREX_FRAME_GAP_HEARTBEAT=${{ inputs.frame_gap_heartbeat && '1' || '0' }}
            export SHAREX_FRAME_GAP_OWNED_BUFFERS=${{ inputs.frame_gap_owned_buffers && '1' || '0' }}
            export SHAREX_FRAME_GAP_NV12=${{ inputs.frame_gap_nv12 && '1' || '0' }}
            export SHAREX_FRAME_GAP_DEEPER_QUEUE=${{ inputs.frame_gap_deeper_queue && '1' || '0' }}
            export SHAREX_FRAME_GAP_TRACE_DIR="$PWD/frame-gap-full-traces/native"
          fi
          defaults write com.sharexmac.ShareX agentCaptureEnabled -bool true
          bash scripts/e2e-agent-capture.sh --app /Applications/ShareX.app \
            --build-settings "$PWD/agent-build-settings.json" --out "$PWD/agent-e2e-out"

      - name: Print native report
        if: ${{ always() && !inputs.frame_gap_surfaces && !inputs.frame_gap_probe && !inputs.frame_gap_replay && !inputs.frame_gap_workload }}
        run: |
          if test -f agent-setup-out/result.json; then cat agent-setup-out/result.json; fi
          if test -f agent-e2e-out/result.json; then
            cat agent-e2e-out/result.json
          else
            echo 'Native evaluation did not produce a report.'
          fi

      - name: Prepare runtime for pinned agent clients
        id: client-runtime
        if: ${{ !cancelled() && !inputs.frame_gap_probe && !inputs.frame_gap_replay && steps.capture-permission.outcome == 'success' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Install pinned agent clients
        id: clients
        if: ${{ !cancelled() && steps.client-runtime.outcome == 'success' }}
        run: |
          npm install --prefix "$RUNNER_TEMP/sharex-agent-clients" --no-audit --no-fund \
            @openai/codex@0.169.0 @anthropic-ai/claude-code@2.1.323

      - name: Trace three native and actual client workload cycles
        if: ${{ !cancelled() && inputs.frame_gap_workload && steps.clients.outcome == 'success' }}
        timeout-minutes: 45
        run: |
          defaults write com.sharexmac.ShareX agentCaptureEnabled -bool true
          python3 scripts/frame-gap-workload.py --app /Applications/ShareX.app \
            --build-settings "$PWD/agent-build-settings.json" \
            --codex "$RUNNER_TEMP/sharex-agent-clients/node_modules/.bin/codex" \
            --claude "$RUNNER_TEMP/sharex-agent-clients/node_modules/.bin/claude" \
            --commit '${{ github.sha }}' --out "$PWD/frame-gap-workload-out"

      - name: Collect original and owned buffer full workflow comparison
        if: ${{ !cancelled() && inputs.frame_gap_surfaces && steps.setup-helper.outcome == 'success' && steps.clients.outcome == 'success' }}
        timeout-minutes: 35
        run: |
          python3 scripts/frame-gap-surfaces.py --app /Applications/ShareX.app \
            --built-app "$PWD/build-agent/Build/Products/Release/ShareX.app" \
            --build-settings "$PWD/agent-build-settings.json" \
            --helper "$RUNNER_TEMP/sharex-agent-setup-helper" \
            --codex "$RUNNER_TEMP/sharex-agent-clients/node_modules/.bin/codex" \
            --claude "$RUNNER_TEMP/sharex-agent-clients/node_modules/.bin/claude" \
            --commit '${{ github.sha }}' --out "$PWD/frame-gap-surfaces-out"

      - name: Print surface comparison collection and original verdicts
        if: ${{ always() && inputs.frame_gap_surfaces }}
        run: |
          if test -f frame-gap-surfaces-out/comparison.json; then cat frame-gap-surfaces-out/comparison.json; fi

      - name: Print frame gap workload report
        if: ${{ always() && inputs.frame_gap_workload }}
        run: |
          if test -f frame-gap-workload-out/workload.json; then cat frame-gap-workload-out/workload.json; fi

      - name: Register and capture through actual Codex and Claude Code clients
        if: ${{ !cancelled() && !inputs.frame_gap_surfaces && !inputs.frame_gap_workload && steps.clients.outcome == 'success' }}
        timeout-minutes: 12
        run: |
          if [[ '${{ inputs.frame_gap_full }}' == true ]]; then
            export SHAREX_FRAME_GAP_WORKLOAD=1 SHAREX_FRAME_GAP_FIXTURE_TRACE=1
            export SHAREX_FRAME_GAP_HEARTBEAT=${{ inputs.frame_gap_heartbeat && '1' || '0' }}
            export SHAREX_FRAME_GAP_OWNED_BUFFERS=${{ inputs.frame_gap_owned_buffers && '1' || '0' }}
            export SHAREX_FRAME_GAP_NV12=${{ inputs.frame_gap_nv12 && '1' || '0' }}
            export SHAREX_FRAME_GAP_DEEPER_QUEUE=${{ inputs.frame_gap_deeper_queue && '1' || '0' }}
            export SHAREX_FRAME_GAP_TRACE_DIR="$PWD/frame-gap-full-traces/clients"
          fi
          defaults write com.sharexmac.ShareX agentCaptureEnabled -bool true
          python3 scripts/e2e-agent-clients.py --app /Applications/ShareX.app \
            --build-settings "$PWD/agent-build-settings.json" \
            --codex "$RUNNER_TEMP/sharex-agent-clients/node_modules/.bin/codex" \
            --claude "$RUNNER_TEMP/sharex-agent-clients/node_modules/.bin/claude" \
            --out "$PWD/agent-clients-out"

      - name: Print actual client report
        if: always()
        run: |
          if test -f agent-clients-out/result.json; then cat agent-clients-out/result.json; fi

      - name: Validate manual recording, permission reset, and real uninstall
        if: ${{ !cancelled() && !inputs.frame_gap_surfaces && !inputs.frame_gap_replay && steps.setup-helper.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          python3 scripts/e2e-desktop-maintenance.py --app /Applications/ShareX.app \
            --build-settings "$PWD/agent-build-settings.json" \
            --helper "$RUNNER_TEMP/sharex-agent-setup-helper" --out "$PWD/desktop-maintenance-out"

      - name: Print desktop maintenance report and failure diagnostics
        if: ${{ always() && !inputs.frame_gap_surfaces && !inputs.frame_gap_probe && !inputs.frame_gap_replay && !inputs.frame_gap_workload }}
        run: |
          if test -f desktop-maintenance-out/result.json; then
            cat desktop-maintenance-out/result.json
          else
            echo 'Desktop maintenance evaluation did not produce a report.'
          fi
          if test -f desktop-maintenance-out/failure.txt; then
            cat desktop-maintenance-out/failure.txt
            tail -n 12 desktop-maintenance-out/events.jsonl
          fi

      - name: Store validation evidence
        if: ${{ always() && (inputs.store_artifacts || inputs.frame_gap_full || inputs.frame_gap_surfaces || inputs.frame_gap_replay) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-capture-${{ github.sha }}
          retention-days: 3
          path: |
            agent-tests.log
            agent-build.log
            agent-build-settings.json
            agent-e2e-out
            agent-setup-out
            agent-clients-out
            desktop-maintenance-out
            frame-gap-probe-out
            frame-gap-workload-out
            frame-gap-replay-out
            frame-gap-replay-traces
            frame-gap-startup-out
            profiler-preflight-out
            profiler-source-clock-out
            frame-gap-full-traces
            frame-gap-surfaces-out
            !frame-gap-surfaces-out/**/client-home/**
            !frame-gap-workload-out/**/client-home/**
            !agent-clients-out/client-home/**
          if-no-files-found: warn
