name: Agent capture

on:
  workflow_call:
    inputs:
      store_artifacts:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      store_artifacts:
        description: Upload native evidence and build logs
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agent-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Select Apple Silicon toolchain
        id: toolchain
        run: |
          test "$(uname -m)" = arm64
          sudo xcode-select -s /Applications/Xcode_26.3.app
          sw_vers
          xcodebuild -version
          swift --version

      - name: Validate scripts and agent protocol
        run: |
          set -o pipefail
          python3 -m unittest discover -s scripts/tests -v
          swift test --package-path Packages/ShareXAgent 2>&1 | tee agent-tests.log

      - name: Generate project
        id: project
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          printf 'DEVELOPMENT_TEAM =\nSHAREX_LOCAL_CONFIG = present\nCODE_SIGN_IDENTITY = -\n' > Local.xcconfig
          scripts/ci-setup.sh

      - name: Build production Release app
        id: release-build
        if: ${{ !cancelled() && steps.project.outcome == 'success' }}
        run: |
          set -o pipefail
          xcodebuild build -project ShareXMac.xcodeproj -scheme ShareX -configuration Release \
            -destination 'platform=macOS' -derivedDataPath build-agent -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee agent-build.log
          xcodebuild -showBuildSettings -json -project ShareXMac.xcodeproj -scheme ShareX \
            -configuration Release -destination 'platform=macOS' -derivedDataPath build-agent \
            -disableAutomaticPackageResolution CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" > agent-build-settings.json

      - name: Install and sign app
        id: installed
        if: ${{ !cancelled() && steps.release-build.outcome == 'success' }}
        run: |
          set -euo pipefail
          test ! -e /Applications/ShareX.app
          codesign --force --deep --options runtime -s - build-agent/Build/Products/Release/ShareX.app
          ditto build-agent/Build/Products/Release/ShareX.app /Applications/ShareX.app
          codesign --verify --deep --strict /Applications/ShareX.app
          test "$(lipo -archs /Applications/ShareX.app/Contents/MacOS/ShareX)" = arm64
          plutil -lint /Applications/ShareX.app/Contents/Info.plist

      - name: Prepare isolated runner permissions
        id: capture-permission
        if: ${{ !cancelled() && steps.installed.outcome == 'success' }}
        run: |
          bash scripts/ci-capture-permissions.sh /Applications/ShareX.app
          defaults write com.sharexmac.ShareX agentCaptureEnabled -bool false

      - name: Build and authorize independent setup driver
        id: setup-helper
        if: ${{ !cancelled() && steps.capture-permission.outcome == 'success' }}
        run: |
          xcrun swiftc -parse-as-library -swift-version 6 -O -target arm64-apple-macosx14.0 \
            scripts/e2e-agent-setup.swift -o "$RUNNER_TEMP/sharex-agent-setup-helper"
          codesign --force -s - "$RUNNER_TEMP/sharex-agent-setup-helper"
          bash scripts/ci-capture-permissions.sh --helper "$RUNNER_TEMP/sharex-agent-setup-helper"

      - name: Validate setup UI and recording controls
        if: ${{ !cancelled() && steps.setup-helper.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          python3 scripts/e2e-agent-setup.py --app /Applications/ShareX.app \
            --build-settings "$PWD/agent-build-settings.json" \
            --helper "$RUNNER_TEMP/sharex-agent-setup-helper" --out "$PWD/agent-setup-out"

      - name: Capture real pixels and verify decoded media
        if: ${{ !cancelled() && steps.capture-permission.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          defaults write com.sharexmac.ShareX agentCaptureEnabled -bool true
          bash scripts/e2e-agent-capture.sh --app /Applications/ShareX.app \
            --build-settings "$PWD/agent-build-settings.json" --out "$PWD/agent-e2e-out"

      - name: Print native report
        if: always()
        run: |
          if test -f agent-setup-out/result.json; then cat agent-setup-out/result.json; fi
          if test -f agent-e2e-out/result.json; then
            cat agent-e2e-out/result.json
          else
            echo 'Native evaluation did not produce a report.'
          fi

      - name: Prepare runtime for pinned agent clients
        id: client-runtime
        if: ${{ !cancelled() && steps.capture-permission.outcome == 'success' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Install pinned agent clients
        id: clients
        if: ${{ !cancelled() && steps.client-runtime.outcome == 'success' }}
        run: |
          npm install --prefix "$RUNNER_TEMP/sharex-agent-clients" --no-audit --no-fund \
            @openai/codex@0.169.0 @anthropic-ai/claude-code@2.1.323

      - name: Capture through actual Codex and Claude Code tools
        if: ${{ !cancelled() && steps.clients.outcome == 'success' }}
        timeout-minutes: 8
        run: |
          defaults write com.sharexmac.ShareX agentCaptureEnabled -bool true
          python3 scripts/e2e-agent-clients.py --app /Applications/ShareX.app \
            --build-settings "$PWD/agent-build-settings.json" \
            --codex "$RUNNER_TEMP/sharex-agent-clients/node_modules/.bin/codex" \
            --claude "$RUNNER_TEMP/sharex-agent-clients/node_modules/.bin/claude" \
            --out "$PWD/agent-clients-out"

      - name: Print actual client report
        if: always()
        run: |
          if test -f agent-clients-out/result.json; then cat agent-clients-out/result.json; fi

      - name: Store validation evidence
        if: ${{ always() && inputs.store_artifacts }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-capture-${{ github.sha }}
          retention-days: 3
          path: |
            agent-tests.log
            agent-build.log
            agent-build-settings.json
            agent-e2e-out
            agent-setup-out
            agent-clients-out
            !agent-clients-out/client-home/**
          if-no-files-found: warn
