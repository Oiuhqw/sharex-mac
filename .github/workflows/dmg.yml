# Builds the shipped DMG. No Developer ID / notarization is available (no paid Apple account), so the app is
# ad-hoc signed with the Hardened Runtime. Gatekeeper still rejects it on first open: see README "Installing".
name: DMG
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
      - name: Generate project (pinned XcodeGen + Package.resolved)
        run: scripts/ci-setup.sh
      - name: Build universal Release (no E2E code; signed ad-hoc below)
        run: |
          set -o pipefail
          xcodebuild build -project ShareXMac.xcodeproj -scheme ShareX -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build -disableAutomaticPackageResolution \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" | tail -40
          APP=build/Build/Products/Release/ShareX.app
          test -d "$APP"
          echo "APP=$APP" >> $GITHUB_ENV
      - name: Shipped binary has no test driver
        run: |
          BIN="$APP/Contents/MacOS/ShareX"
          if strings -a "$BIN" | grep -E -- '--e2e|E2E PERF|e2e-helper'; then
            echo "::error::E2E code found in the shipped binary"; exit 1
          fi
          echo "no --e2e strings in $BIN"
          # Symbols too: any E2E/E2EPerf/E2EOrientation type or function left in the binary fails the build.
          SYMS=$(nm -a "$BIN" 2>/dev/null | grep -E 'E2E|e2eFixture|e2eDisplayFixture|e2eSurfaces' || true)
          if [ -n "$SYMS" ]; then echo "$SYMS" | head -20; echo "::error::E2E symbols found in the shipped binary"; exit 1; fi
          echo "nm: no E2E symbols ($(nm -a "$BIN" 2>/dev/null | wc -l | tr -d ' ') symbols checked)"
      - name: Verify packaged icon
        run: |
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$APP/Contents/Info.plist")" = AppIcon
          test -s "$APP/Contents/Resources/AppIcon.icns"
          iconutil -c iconset "$APP/Contents/Resources/AppIcon.icns" -o /tmp/ShareX.iconset
          # actool can keep large representations in Assets.car; iconutil's legacy filenames vary.
          # Require a decodable legacy icon, and report the representations actually packaged.
          test -n "$(find /tmp/ShareX.iconset -name '*.png' -print -quit)"
          find /tmp/ShareX.iconset -name '*.png' -exec sips -g pixelWidth -g pixelHeight {} \;
      - name: Ad-hoc sign inside-out with Hardened Runtime (no --deep)
        run: |
          # Nested code first (frameworks, dylibs, helpers, XPC, bundles), deepest paths first, then the app.
          find "$APP/Contents" -depth \( -name '*.framework' -o -name '*.dylib' -o -name '*.xpc' -o -name '*.appex' -o -name '*.bundle' -o -name '*.app' \) -print0 \
            | while IFS= read -r -d '' item; do
                [ "$item" = "$APP" ] && continue
                echo "sign $item"; codesign --force --options runtime --timestamp=none --sign - "$item"
              done
          codesign --force --options runtime --timestamp=none --sign - "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee sig.txt
          grep -E 'flags=0x[0-9a-f]+\(.*runtime' sig.txt || { echo "::error::Hardened Runtime flag missing"; exit 1; }
          spctl -a -vvv -t exec "$APP" || echo "spctl rejects (expected: ad-hoc, not notarized)"
          lipo -info "$APP/Contents/MacOS/ShareX"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' -c 'Print :LSMinimumSystemVersion' -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist"
      - name: Launch smoke test (direct exec, Hardened Runtime)
        run: |
          "$APP/Contents/MacOS/ShareX" & PID=$!
          sleep 8
          kill -0 $PID || { echo "::error::app exited under Hardened Runtime"; exit 1; }
          echo "still running after 8s"; kill $PID || true
      - name: Make DMG
        run: |
          mkdir dmgroot
          cp -R "$APP" dmgroot/
          ln -s /Applications dmgroot/Applications
          cp INSTALL.txt dmgroot/
          hdiutil create -volname ShareX -srcfolder dmgroot -ov -format UDZO ShareX.dmg
          hdiutil verify ShareX.dmg
          shasum -a 256 ShareX.dmg | tee ShareX.dmg.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ShareX-dmg
          path: |
            ShareX.dmg
            ShareX.dmg.sha256
            INSTALL.txt
      - name: Quarantine-simulated install + launch (what a downloaded DMG gets)
        timeout-minutes: 4
        run: |
          # macOS has no GNU timeout: bound each Gatekeeper call with a perl alarm (SIGALRM kills it, exit 142).
          t() { local s=$1; shift; perl -e 'alarm shift; exec @ARGV' "$s" "$@"; }
          R="$GITHUB_STEP_SUMMARY"; echo "### Quarantine probe" >> "$R"
          xattr -w com.apple.quarantine "0081;$(printf %x $(date +%s));Safari;" ShareX.dmg
          MNT=$(hdiutil attach -nobrowse -readonly ShareX.dmg | awk -F'\t' '/\/Volumes\//{print $NF}')
          rm -rf /tmp/inst && mkdir /tmp/inst && cp -R "$MNT/ShareX.app" /tmp/inst/
          hdiutil detach "$MNT"
          xattr -w com.apple.quarantine "0081;$(printf %x $(date +%s));Safari;" /tmp/inst/ShareX.app
          xattr -l /tmp/inst/ShareX.app | tee -a "$R"
          codesign --verify --strict --verbose=2 /tmp/inst/ShareX.app
          set +e
          t 60 spctl -a -vvv -t exec /tmp/inst/ShareX.app > spctl.txt 2>&1; SP=$?
          cat spctl.txt; echo "- spctl exit $SP: $(tr '\n' ' ' < spctl.txt)" >> "$R"
          t 20 open /tmp/inst/ShareX.app; OP=$?
          sleep 6
          if pgrep -x ShareX >/dev/null; then Q="launched with quarantine (runner Gatekeeper allowed it)"; pkill -x ShareX
          else Q="blocked under quarantine (expected for unnotarized)"; fi
          echo "- open exit $OP; $Q" | tee -a "$R"
          xattr -dr com.apple.quarantine /tmp/inst/ShareX.app
          echo "- quarantine after xattr -dr: $(xattr -p com.apple.quarantine /tmp/inst/ShareX.app 2>&1)" | tee -a "$R"
          t 20 open /tmp/inst/ShareX.app; OP2=$?
          sleep 6
          if pgrep -x ShareX >/dev/null; then echo "- xattr -dr workaround: launched (open exit $OP2)" | tee -a "$R"; pkill -x ShareX; RC=0
          else echo "- xattr -dr workaround: FAILED to launch (open exit $OP2)" | tee -a "$R"; echo "::error::app does not launch after removing quarantine"; RC=1; fi
          exit $RC
