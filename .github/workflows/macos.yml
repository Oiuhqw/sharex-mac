# Builds the app unsigned and runs the core tests on one macOS runner.
name: macOS

on:
  push:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

          sw_vers
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Local.xcconfig (no team, unsigned)
        run: printf 'DEVELOPMENT_TEAM =\nSHAREX_LOCAL_CONFIG = present\nCODE_SIGN_IDENTITY = -\n' > Local.xcconfig

      - name: Generate project
        run: xcodegen generate

      - name: Core tests (seeded fuzz harness included)
        working-directory: Packages/ShareXCore
        run: swift test --parallel

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ShareXMac.xcodeproj \
            -scheme ShareX \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee xcodebuild.log

      - name: Smoke test (launch, stay alive 10 s, quit)
        run: |
          APP=build/Build/Products/Debug/ShareX.app
          test -x "$APP/Contents/MacOS/ShareX"
          plutil -lint "$APP/Contents/Info.plist"
          "$APP/Contents/MacOS/ShareX" > smoke.log 2>&1 &
          PID=$!
          sleep 10
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::ShareX exited during launch"; cat smoke.log; exit 1
          fi
          kill "$PID"; wait "$PID" 2>/dev/null || true
          echo "ShareX stayed up for 10 s"

      - name: E2E (real app, real pasteboard; SCK if TCC grant works)
        run: scripts/e2e.sh

      - name: Build app (Release, for perf)
        if: always()
        run: |
          set -o pipefail
          xcodebuild build -project ShareXMac.xcodeproj -scheme ShareX -configuration Release \
            -destination 'platform=macOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -5

      - name: Perf scenario (Release, 2x synthetic display)
        if: always()
        run: scripts/perf.sh

      - name: Upload perf
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf
          path: perf-out
          if-no-files-found: ignore

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: e2e-out
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            xcodebuild.log
            smoke.log
          if-no-files-found: ignore
