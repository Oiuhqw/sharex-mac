# Builds the app unsigned and runs the core tests on one macOS runner.
name: macOS

on:
  push:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner architecture
        type: choice
        options: [macos-15, macos-15-intel]
        default: macos-15

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}-${{ inputs.runner || 'macos-15' }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: CI script regression tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Toolchain
        run: |
          test -d /Applications/Xcode_26.3.app
          sudo xcode-select -s /Applications/Xcode_26.3.app

          sw_vers
          xcodebuild -version
          swift --version

      - name: Local.xcconfig (no team, unsigned)
        run: printf 'DEVELOPMENT_TEAM =\nSHAREX_LOCAL_CONFIG = present\nCODE_SIGN_IDENTITY = -\n' > Local.xcconfig

      - name: Generate project (pinned XcodeGen + Package.resolved)
        run: scripts/ci-setup.sh

      - name: Core tests (deterministic property tests included)
        working-directory: Packages/ShareXCore
        env:
          FUZZ_SEED: '1525137630'
          FUZZ_SCALE: '1'
        run: |
          set -o pipefail
          swift test --parallel 2>&1 | tee ../../core-tests.log

      - name: Core tests with AddressSanitizer
        working-directory: Packages/ShareXCore
        env:
          FUZZ_SEED: '3405691582'
          FUZZ_SCALE: '1'
        run: |
          set -o pipefail
          swift test --sanitize=address --parallel 2>&1 | tee ../../core-asan.log

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ShareXMac.xcodeproj \
            -scheme ShareX \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) SHAREX_E2E' \
            | tee xcodebuild.log

      - name: Smoke test (launch, stay alive 10 s, quit)
        run: |
          APP=build/Build/Products/Debug/ShareX.app
          test -x "$APP/Contents/MacOS/ShareX"
          plutil -lint "$APP/Contents/Info.plist"
          "$APP/Contents/MacOS/ShareX" > smoke.log 2>&1 &
          PID=$!
          sleep 10
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::ShareX exited during launch"; cat smoke.log; exit 1
          fi
          kill "$PID"; wait "$PID" 2>/dev/null || true
          echo "ShareX stayed up for 10 s"

      - name: E2E (real app, real pasteboard; SCK if TCC grant works)
        run: scripts/e2e.sh

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e
          path: e2e-out
          if-no-files-found: ignore

      - name: Build app (Release, for perf)
        if: always()
        run: |
          set -o pipefail
          xcodebuild build -project ShareXMac.xcodeproj -scheme ShareX -configuration Release \
            -destination 'platform=macOS' -derivedDataPath build -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) SHAREX_E2E' 2>&1 | tee xcodebuild-release.log | tail -5

      - name: Perf and resource scenarios (Release, synthetic 2x and runner display)
        if: always()
        timeout-minutes: 8
        run: scripts/perf.sh

      - name: Memory ownership diagnosis (separate Release process)
        if: always()
        run: |
          python3 scripts/run-bounded.py --timeout 120 --log perf-out/memory-diagnosis/driver.log -- \
            build/Build/Products/Release/ShareX.app/Contents/MacOS/ShareX \
            --e2e "$PWD/perf-out/memory-diagnosis" --memory-diagnosis

      - name: Upload perf
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf
          path: perf-out
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs
          path: |
            xcodebuild.log
            xcodebuild-release.log
            core-tests.log
            core-asan.log
            smoke.log
          if-no-files-found: ignore

  package:
    needs: build-and-test
    uses: ./.github/workflows/dmg.yml
    with:
      runner: ${{ inputs.runner || 'macos-15' }}

