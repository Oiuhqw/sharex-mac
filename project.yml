name: ShareXMac
options:
  bundleIdPrefix: com.sharexmac
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  ShareXCore:
    path: Packages/ShareXCore
  ShareXAgent:
    path: Packages/ShareXAgent
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 3.1.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
targets:
  ShareX:
    type: application
    platform: macOS
    sources: [App/Sources, App/Resources/Assets.xcassets]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ShareX
        CFBundleShortVersionString: "0.2.1"
        CFBundleVersion: "9"
        CFBundleIconName: AppIcon
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "GPL-3.0 port of ShareX features"
    dependencies:
      - package: ShareXCore
        product: ShareXCore
      - package: ShareXAgent
        product: ShareXAgent
      - package: KeyboardShortcuts
    # Base.xcconfig includes the git-ignored Local.xcconfig (DEVELOPMENT_TEAM); see Local.xcconfig.example.
    configFiles:
      Debug: Base.xcconfig
      Release: Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sharexmac.ShareX
        PRODUCT_NAME: ShareX
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        SWIFT_STRICT_CONCURRENCY: complete
    preBuildScripts:
      - name: Require Local.xcconfig
        basedOnDependencyAnalysis: false
        script: |
          if [ "${CODE_SIGNING_ALLOWED}" != "NO" ] && [ "${SHAREX_LOCAL_CONFIG}" != "present" ]; then
            echo "error: Local.xcconfig is missing. Copy Local.xcconfig.example to Local.xcconfig and set DEVELOPMENT_TEAM (or build with CODE_SIGNING_ALLOWED=NO)."
            exit 1
          fi
