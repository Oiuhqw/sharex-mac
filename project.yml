name: ShareXMac
options:
  bundleIdPrefix: com.sharexmac
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  ShareXCore:
    path: Packages/ShareXCore
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 2.3.0  # swift-tools 5.11, works on Xcode 16.0+ (2.4.0 needs Xcode 16.3+)
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  ShareX:
    type: application
    platform: macOS
    sources: [App/Sources]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ShareX
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "GPL-3.0 port of ShareX features"
    dependencies:
      - package: ShareXCore
        product: ShareXCore
      - package: KeyboardShortcuts
    # Base.xcconfig includes the git-ignored Local.xcconfig (DEVELOPMENT_TEAM); see Local.xcconfig.example.
    configFiles:
      Debug: Base.xcconfig
      Release: Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sharexmac.ShareX
        PRODUCT_NAME: ShareX
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        SWIFT_STRICT_CONCURRENCY: complete
    preBuildScripts:
      - name: Require Local.xcconfig
        basedOnDependencyAnalysis: false
        script: |
          if [ "${CODE_SIGNING_ALLOWED}" != "NO" ] && [ "${SHAREX_LOCAL_CONFIG}" != "present" ]; then
            echo "error: Local.xcconfig is missing. Copy Local.xcconfig.example to Local.xcconfig and set DEVELOPMENT_TEAM (or build with CODE_SIGNING_ALLOWED=NO)."
            exit 1
          fi
